[tool.poetry]
name = "python-geo-utils"
version = "0.1.0"
description = "Misc scripts for dealing with GPS in Python"
authors = ["Matthew Cox <github@azriel.net>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
ExifRead = "^3.0.0"
gpxpy = "^1.6.2"
geojson = "^3.1.0"
latlon3 = "^1.0.4"

[tool.poetry.group.dev.dependencies]
pylint = "^3.2.3"
pyright = "^1.1.366"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
